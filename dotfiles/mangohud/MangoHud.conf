# MangoHud overlay, symlinked into ~/.config/MangoHud/MangoHud.conf.
# Full option list: https://github.com/flightlessmango/MangoHud/blob/master/MangoHud.conf
position=top-left
font_size=18
background_alpha=0.4
round_corners=8
text_outline

# Frame pacing
fps
frametime

# GPU
gpu_stats
gpu_temp
gpu_power
gpu_load_change

# CPU
cpu_stats
cpu_temp
cpu_power
cpu_load_change

# Memory
vram
ram
swap
